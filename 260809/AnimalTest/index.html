<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동물상 테스트</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg-start: #1e293b;
    --bg-end: #0f172a;
    --card-bg: #ffffff;
    --card-shadow: rgba(0, 0, 0, 0.3);
    --title-color: #1e293b;
    --desc-color: #64748b;
    --label-color: #334155;
    --preview-bg: #f1f5f9;
    --preview-border: #cbd5e1;
    --btn-bg: #2563eb;
    --btn-bg-hover: #1d4ed8;
    --btn-text: #ffffff;
    --btn-secondary-bg: #f1f5f9;
    --btn-secondary-bg-hover: #e2e8f0;
    --btn-secondary-text: #334155;
    --toggle-bg: rgba(255, 255, 255, 0.15);
    --toggle-border: rgba(255, 255, 255, 0.3);
    --bar-track: #e2e8f0;
    --bar-fill: #2563eb;
    --result-color: #1e293b;
  }

  html[data-theme="dark"] {
    --bg-start: #020617;
    --bg-end: #000000;
    --card-bg: #1e293b;
    --card-shadow: rgba(0, 0, 0, 0.5);
    --title-color: #f1f5f9;
    --desc-color: #94a3b8;
    --label-color: #cbd5e1;
    --preview-bg: #0f172a;
    --preview-border: #334155;
    --btn-bg: #3b82f6;
    --btn-bg-hover: #2563eb;
    --btn-text: #ffffff;
    --btn-secondary-bg: #0f172a;
    --btn-secondary-bg-hover: #1e293b;
    --btn-secondary-text: #cbd5e1;
    --toggle-bg: rgba(255, 255, 255, 0.08);
    --toggle-border: rgba(255, 255, 255, 0.2);
    --bar-track: #334155;
    --bar-fill: #3b82f6;
    --result-color: #f1f5f9;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    transition: background 0.3s ease;
    padding: 24px 0;
  }
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--toggle-border);
    background: var(--toggle-bg);
    color: #ffffff;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  .theme-toggle:hover { background: rgba(255, 255, 255, 0.25); }
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 40px 32px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 40px var(--card-shadow);
    transition: background 0.3s ease;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 24px;
    color: var(--title-color);
    transition: color 0.3s ease;
  }
  p.desc {
    margin: 0 0 24px;
    color: var(--desc-color);
    font-size: 14px;
    transition: color 0.3s ease;
  }
  .preview {
    width: 200px;
    height: 200px;
    margin: 0 auto 20px;
    border-radius: 16px;
    background: var(--preview-bg);
    border: 2px dashed var(--preview-border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  .preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .preview .placeholder {
    font-size: 40px;
    color: var(--desc-color);
  }
  input[type="file"] { display: none; }
  .btn-row {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  button {
    border: none;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 20px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
    flex: 1;
    font-family: inherit;
  }
  .btn-primary {
    background: var(--btn-bg);
    color: var(--btn-text);
  }
  .btn-primary:hover { background: var(--btn-bg-hover); }
  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn-secondary {
    background: var(--btn-secondary-bg);
    color: var(--btn-secondary-text);
  }
  .btn-secondary:hover { background: var(--btn-secondary-bg-hover); }
  .status {
    font-size: 13px;
    color: var(--desc-color);
    margin: 12px 0 0;
    min-height: 18px;
    transition: color 0.3s ease;
  }
  .results {
    margin-top: 24px;
    text-align: left;
    display: none;
  }
  .results.visible { display: block; }
  .result-headline {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: var(--result-color);
    margin-bottom: 20px;
    transition: color 0.3s ease;
  }
  .bar-row {
    margin-bottom: 14px;
  }
  .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: var(--label-color);
    margin-bottom: 6px;
    transition: color 0.3s ease;
  }
  .bar-track {
    width: 100%;
    height: 10px;
    border-radius: 6px;
    background: var(--bar-track);
    overflow: hidden;
    transition: background 0.3s ease;
  }
  .bar-fill {
    height: 100%;
    border-radius: 6px;
    background: var(--bar-fill);
    width: 0%;
    transition: width 0.6s ease, background 0.3s ease;
  }
</style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="테마 전환">🌙</button>
  <div class="card">
    <h1>🐶🐱 동물상 테스트</h1>
    <p class="desc">얼굴 사진을 올리면 AI가 강아지상인지 고양이상인지 알려드려요.</p>

    <div class="preview" id="preview">
      <span class="placeholder">📷</span>
    </div>

    <div class="btn-row">
      <button class="btn-secondary" id="uploadBtn">사진 선택하기</button>
      <input type="file" id="fileInput" accept="image/*" capture="user">
    </div>
    <button class="btn-primary" id="predictBtn" disabled>결과 확인하기</button>
    <p class="status" id="statusText">모델을 불러오는 중...</p>

    <div class="results" id="results">
      <p class="result-headline" id="resultHeadline"></p>
      <div id="barsContainer"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/1a8hzp9uX/";

  const preview = document.getElementById("preview");
  const uploadBtn = document.getElementById("uploadBtn");
  const fileInput = document.getElementById("fileInput");
  const predictBtn = document.getElementById("predictBtn");
  const statusText = document.getElementById("statusText");
  const results = document.getElementById("results");
  const resultHeadline = document.getElementById("resultHeadline");
  const barsContainer = document.getElementById("barsContainer");

  let model = null;
  let previewImg = null;

  function emojiFor(label) {
    const l = label.toLowerCase();
    if (l.includes("dog") || l.includes("강아지") || l.includes("개")) return "🐶";
    if (l.includes("cat") || l.includes("고양이")) return "🐱";
    return "🐾";
  }

  async function loadModel() {
    try {
      model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
      statusText.textContent = "이미지를 선택하고 결과를 확인해보세요.";
      if (previewImg) predictBtn.disabled = false;
    } catch (err) {
      statusText.textContent = "모델을 불러오지 못했습니다. 잠시 후 새로고침해주세요.";
    }
  }

  uploadBtn.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);
    preview.innerHTML = "";
    const img = document.createElement("img");
    img.src = url;
    img.onload = () => {
      previewImg = img;
      if (model) predictBtn.disabled = false;
    };
    preview.appendChild(img);

    results.classList.remove("visible");
  });

  predictBtn.addEventListener("click", async () => {
    if (!model || !previewImg) return;
    predictBtn.disabled = true;
    statusText.textContent = "분석 중...";

    try {
      const predictions = await model.predict(previewImg);
      predictions.sort((a, b) => b.probability - a.probability);

      const top = predictions[0];
      resultHeadline.textContent = `${emojiFor(top.className)} 당신은 ${(top.probability * 100).toFixed(1)}% ${top.className}상 입니다!`;

      barsContainer.innerHTML = "";
      predictions.forEach((p) => {
        const pct = (p.probability * 100).toFixed(1);
        const row = document.createElement("div");
        row.className = "bar-row";
        row.innerHTML = `
          <div class="bar-label"><span>${emojiFor(p.className)} ${p.className}</span><span>${pct}%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        `;
        barsContainer.appendChild(row);
      });

      results.classList.add("visible");
      statusText.textContent = "다른 사진으로도 테스트해보세요!";
    } catch (err) {
      statusText.textContent = "분석 중 오류가 발생했습니다. 다시 시도해주세요.";
    } finally {
      predictBtn.disabled = false;
    }
  });

  const themeToggle = document.getElementById("themeToggle");
  const root = document.documentElement;

  function applyTheme(theme) {
    root.setAttribute("data-theme", theme);
    themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
    localStorage.setItem("animaltest-theme", theme);
  }

  const savedTheme = localStorage.getItem("animaltest-theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(savedTheme || (prefersDark ? "dark" : "light"));

  themeToggle.addEventListener("click", () => {
    const current = root.getAttribute("data-theme");
    applyTheme(current === "dark" ? "light" : "dark");
  });

  loadModel();
</script>
</body>
</html>

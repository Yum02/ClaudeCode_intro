<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="바이브코딩 프로젝트에 제휴, 협업, 광고 문의를 남길 수 있는 연락 페이지입니다.">
<meta name="google-adsense-account" content="ca-pub-5605699409645651">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5605699409645651" crossorigin="anonymous"></script>
<title>제휴 문의</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg-start: #1e293b;
    --bg-end: #0f172a;
    --card-bg: #ffffff;
    --card-shadow: rgba(0, 0, 0, 0.3);
    --title-color: #1e293b;
    --desc-color: #64748b;
    --label-color: #334155;
    --input-bg: #f8fafc;
    --input-border: #cbd5e1;
    --input-text: #1e293b;
    --btn-bg: #2563eb;
    --btn-bg-hover: #1d4ed8;
    --btn-text: #ffffff;
    --toggle-bg: rgba(255, 255, 255, 0.15);
    --toggle-border: rgba(255, 255, 255, 0.3);
    --success-color: #16a34a;
    --error-color: #dc2626;
  }

  html[data-theme="dark"] {
    --bg-start: #020617;
    --bg-end: #000000;
    --card-bg: #1e293b;
    --card-shadow: rgba(0, 0, 0, 0.5);
    --title-color: #f1f5f9;
    --desc-color: #94a3b8;
    --label-color: #cbd5e1;
    --input-bg: #0f172a;
    --input-border: #334155;
    --input-text: #f1f5f9;
    --btn-bg: #3b82f6;
    --btn-bg-hover: #2563eb;
    --btn-text: #ffffff;
    --toggle-bg: rgba(255, 255, 255, 0.08);
    --toggle-border: rgba(255, 255, 255, 0.2);
    --success-color: #4ade80;
    --error-color: #f87171;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    transition: background 0.3s ease;
    padding: 24px 0;
  }
  .site-footer {
    width: 90%;
    max-width: 460px;
    text-align: center;
    font-size: 12px;
    color: var(--desc-color);
    transition: color 0.3s ease;
  }
  .site-footer nav a {
    color: inherit;
    text-decoration: underline;
    margin: 0 6px;
  }
  .site-footer p { margin: 8px 0 0; }
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--toggle-border);
    background: var(--toggle-bg);
    color: #ffffff;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  .theme-toggle:hover { background: rgba(255, 255, 255, 0.25); }
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 40px 32px;
    width: 90%;
    max-width: 460px;
    box-shadow: 0 20px 40px var(--card-shadow);
    transition: background 0.3s ease;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 24px;
    color: var(--title-color);
    text-align: center;
    transition: color 0.3s ease;
  }
  p.desc {
    margin: 0 0 28px;
    color: var(--desc-color);
    font-size: 14px;
    text-align: center;
    transition: color 0.3s ease;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--label-color);
    margin-bottom: 6px;
    transition: color 0.3s ease;
  }
  input, textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--input-text);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s, background 0.3s ease, color 0.3s ease;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--btn-bg);
  }
  textarea {
    resize: vertical;
    min-height: 100px;
  }
  button[type="submit"] {
    border: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 16px;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 4px;
  }
  button[type="submit"]:hover { background: var(--btn-bg-hover); }
  button[type="submit"]:active { transform: translateY(1px); }
  button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .status-message {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    margin-top: 4px;
    display: none;
  }
  .status-message.success {
    display: block;
    color: var(--success-color);
  }
  .status-message.error {
    display: block;
    color: var(--error-color);
  }
</style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="테마 전환">🌙</button>
  <div class="card">
    <h1>🤝 제휴 문의</h1>
    <p class="desc">제휴/협업 관련 문의사항을 남겨주시면 빠르게 답변드리겠습니다.</p>

    <form id="contactForm" action="https://formspree.io/f/xyegkvyk" method="POST">
      <div>
        <label for="name">이름</label>
        <input type="text" id="name" name="name" required placeholder="홍길동">
      </div>
      <div>
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" required placeholder="example@email.com">
      </div>
      <div>
        <label for="company">회사/단체명 (선택)</label>
        <input type="text" id="company" name="company" placeholder="회사명을 입력해주세요">
      </div>
      <div>
        <label for="message">문의 내용</label>
        <textarea id="message" name="message" required placeholder="제휴 문의 내용을 입력해주세요."></textarea>
      </div>
      <button type="submit" id="submitBtn">문의 보내기</button>
      <p class="status-message" id="statusMessage"></p>
    </form>
  </div>

  <footer class="site-footer">
    <nav>
      <a href="../">홈</a> · <a href="../About/">사이트 소개</a> · <a href="../Privacy/">개인정보처리방침</a> · <a href="../RandomLotto/">로또 번호 추천</a>
    </nav>
    <p>&copy; 2026 바이브코딩 프로젝트</p>
  </footer>

<script>
  const themeToggle = document.getElementById("themeToggle");
  const root = document.documentElement;

  function applyTheme(theme) {
    root.setAttribute("data-theme", theme);
    themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
    localStorage.setItem("contact-theme", theme);
  }

  const savedTheme = localStorage.getItem("contact-theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(savedTheme || (prefersDark ? "dark" : "light"));

  themeToggle.addEventListener("click", () => {
    const current = root.getAttribute("data-theme");
    applyTheme(current === "dark" ? "light" : "dark");
  });

  const form = document.getElementById("contactForm");
  const submitBtn = document.getElementById("submitBtn");
  const statusMessage = document.getElementById("statusMessage");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    statusMessage.className = "status-message";
    statusMessage.textContent = "";

    try {
      const response = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { "Accept": "application/json" }
      });

      if (response.ok) {
        statusMessage.textContent = "문의가 정상적으로 전송되었습니다. 감사합니다!";
        statusMessage.className = "status-message success";
        form.reset();
      } else {
        statusMessage.textContent = "전송에 실패했습니다. 잠시 후 다시 시도해주세요.";
        statusMessage.className = "status-message error";
      }
    } catch (err) {
      statusMessage.textContent = "네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.";
      statusMessage.className = "status-message error";
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>

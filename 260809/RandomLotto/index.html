<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-adsense-account" content="ca-pub-5605699409645651">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5605699409645651" crossorigin="anonymous"></script>
<title>로또 번호 추천</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg-start: #1e293b;
    --bg-end: #0f172a;
    --card-bg: #ffffff;
    --card-shadow: rgba(0, 0, 0, 0.3);
    --title-color: #1e293b;
    --desc-color: #64748b;
    --btn-bg: #2563eb;
    --btn-bg-hover: #1d4ed8;
    --btn-text: #ffffff;
    --toggle-bg: rgba(255, 255, 255, 0.15);
    --toggle-border: rgba(255, 255, 255, 0.3);
  }

  html[data-theme="dark"] {
    --bg-start: #020617;
    --bg-end: #000000;
    --card-bg: #1e293b;
    --card-shadow: rgba(0, 0, 0, 0.5);
    --title-color: #f1f5f9;
    --desc-color: #94a3b8;
    --btn-bg: #3b82f6;
    --btn-bg-hover: #2563eb;
    --btn-text: #ffffff;
    --toggle-bg: rgba(255, 255, 255, 0.08);
    --toggle-border: rgba(255, 255, 255, 0.2);
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    transition: background 0.3s ease;
    padding: 24px 0;
  }
  .comments {
    width: 90%;
    max-width: 420px;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 20px 40px var(--card-shadow);
    transition: background 0.3s ease;
  }
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--toggle-border);
    background: var(--toggle-bg);
    color: #ffffff;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  .theme-toggle:hover { background: rgba(255, 255, 255, 0.25); }
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 40px 32px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 40px var(--card-shadow);
    transition: background 0.3s ease;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 24px;
    color: var(--title-color);
    transition: color 0.3s ease;
  }
  p.desc {
    margin: 0 0 28px;
    color: var(--desc-color);
    font-size: 14px;
    transition: color 0.3s ease;
  }
  .numbers {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    min-height: 56px;
    margin-bottom: 28px;
  }
  .ball {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 17px;
    color: #ffffff;
    opacity: 0;
    transform: scale(0.5);
    animation: pop 0.4s ease forwards;
  }
  @keyframes pop {
    to { opacity: 1; transform: scale(1); }
  }
  button#generateBtn {
    border: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 16px;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button#generateBtn:hover { background: var(--btn-bg-hover); }
  button#generateBtn:active { transform: translateY(1px); }
</style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="테마 전환">🌙</button>
  <div class="card">
    <h1>🎱 로또 번호 추천</h1>
    <p class="desc">버튼을 누르면 1~45 중 6개의 번호를 무작위로 추천해드려요.</p>
    <div class="numbers" id="numbers"></div>
    <button id="generateBtn">번호 추천받기</button>
  </div>

  <div class="comments">
    <div id="disqus_thread"></div>
    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
  </div>

<script>
  function ballColor(n) {
    if (n <= 10) return "#fbc400";
    if (n <= 20) return "#69c8f2";
    if (n <= 30) return "#ff7272";
    if (n <= 40) return "#aaaaaa";
    return "#b0d840";
  }

  function generateLottoNumbers() {
    const numbers = new Set();
    while (numbers.size < 6) {
      numbers.add(Math.floor(Math.random() * 45) + 1);
    }
    return [...numbers].sort((a, b) => a - b);
  }

  const numbersEl = document.getElementById("numbers");
  const btn = document.getElementById("generateBtn");

  btn.addEventListener("click", () => {
    const numbers = generateLottoNumbers();
    numbersEl.innerHTML = "";
    btn.disabled = true;

    numbers.forEach((n, i) => {
      setTimeout(() => {
        const ball = document.createElement("div");
        ball.className = "ball";
        ball.textContent = n;
        ball.style.background = ballColor(n);
        numbersEl.appendChild(ball);
        if (i === numbers.length - 1) {
          btn.disabled = false;
        }
      }, i * 500);
    });
  });

  const themeToggle = document.getElementById("themeToggle");
  const root = document.documentElement;

  function applyTheme(theme) {
    root.setAttribute("data-theme", theme);
    themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
    localStorage.setItem("lotto-theme", theme);
  }

  const savedTheme = localStorage.getItem("lotto-theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(savedTheme || (prefersDark ? "dark" : "light"));

  themeToggle.addEventListener("click", () => {
    const current = root.getAttribute("data-theme");
    applyTheme(current === "dark" ? "light" : "dark");
  });
</script>

<script>
  var disqus_config = function () {
    this.page.url = window.location.href;
    this.page.identifier = "randomlotto";
  };
  (function() {
    var d = document, s = d.createElement('script');
    s.src = 'https://yum02.disqus.com/embed.js';
    s.setAttribute('data-timestamp', +new Date());
    (d.head || d.body).appendChild(s);
  })();
</script>
</body>
</html>
